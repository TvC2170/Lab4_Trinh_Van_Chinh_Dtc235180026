# Ansible Inventory — DevOps Lab 4

[webservers]
web-server-1 ansible_host=127.0.0.1 ansible_port=2201
web-server-2 ansible_host=127.0.0.1 ansible_port=2202

[dbservers]
db-server-1 ansible_host=127.0.0.1 ansible_port=2203

[production:children]
webservers
dbservers

[all:vars]
ansible_user=root
ansible_password=root
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
