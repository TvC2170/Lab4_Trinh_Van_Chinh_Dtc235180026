name: Run Ansible Lab 4

on:
  push:
    branches: [main]
    paths-ignore:
      - "results/**"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab4:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and SSH password helper
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ansible>=9,<10'
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Start managed nodes
        run: |
          mkdir -p results
          docker compose up -d
          docker compose ps | tee results/01-containers.txt
          for port in 2201 2202 2203; do
            for attempt in $(seq 1 30); do
              if timeout 2 bash -c "</dev/tcp/127.0.0.1/${port}" 2>/dev/null; then
                break
              fi
              sleep 2
            done
          done

      - name: Verify inventory and Ansible connectivity
        run: |
          ansible --version | tee results/ansible-version.txt
          ansible-inventory --list | tee results/inventory.json
          ansible all -m ping | tee results/02-ansible-ping.txt

      - name: Run ad-hoc checks
        run: |
          {
            echo '=== OS release ==='
            ansible all -m shell -a 'cat /etc/os-release | head -3'
            echo '=== Disk ==='
            ansible all -m shell -a 'df -h /'
            echo '=== Memory ==='
            ansible all -m shell -a 'free -m | head -2'
            echo '=== Web hostnames ==='
            ansible webservers -m shell -a hostname
            echo '=== Install curl ==='
            ansible all -m apt -a 'name=curl state=present update_cache=yes'
          } 2>&1 | tee results/03-adhoc-check.txt

      - name: Run web server playbook and verify HTTP
        run: |
          ansible-playbook playbook-webserver.yml --syntax-check 2>&1 | tee results/webserver-syntax.txt
          ansible-playbook playbook-webserver.yml 2>&1 | tee results/04-playbook-webserver.txt
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8081 | tee results/web-server-1.html
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8082 | tee results/web-server-2.html

      - name: Run full stack playbook
        run: |
          ansible-playbook playbook-full.yml --syntax-check 2>&1 | tee results/full-syntax.txt
          ansible-playbook playbook-full.yml 2>&1 | tee results/05-playbook-full.txt
          ansible all -m shell -a '/opt/myapp/health-check.sh' 2>&1 | tee results/health-check.txt
          ansible all -m shell -a 'cat /opt/myapp/config.env' 2>&1 | tee results/app-config.txt

      - name: Verify idempotency
        run: |
          ansible-playbook playbook-webserver.yml 2>&1 | tee results/06-idempotent.txt

      - name: Capture terminal screenshots of actual results
        run: |
          sudo apt-get update
          sudo apt-get install -y scrot xterm xvfb
          mkdir -p screenshots
          capture_terminal() {
            local source_file="$1"
            local title="$2"
            local output_file="$3"
            xvfb-run -a -s '-screen 0 1920x1080x24' bash -c '
              xterm -geometry 160x50+0+0 -fa "DejaVu Sans Mono" -fs 11 -title "$2" \
                -e bash -lc "cat \"$1\"; sleep 5" &
              sleep 2
              scrot "$3"
              wait
            ' _ "$source_file" "$title" "$output_file"
          }
          capture_terminal results/02-ansible-ping.txt 'Lab 4 | Ansible ping | GitHub Actions' screenshots/01-ansible-ping.png
          capture_terminal results/03-adhoc-check.txt 'Lab 4 | Ad-hoc checks | GitHub Actions' screenshots/02-adhoc-check.png
          capture_terminal results/04-playbook-webserver.txt 'Lab 4 | Web server playbook | GitHub Actions' screenshots/03-playbook-webserver.png
          capture_terminal results/05-playbook-full.txt 'Lab 4 | Full playbook | GitHub Actions' screenshots/04-playbook-full.png
          capture_terminal results/06-idempotent.txt 'Lab 4 | Idempotency | GitHub Actions' screenshots/05-idempotent.png

      - name: Upload actual run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab4-ansible-results
          path: |
            results/
            screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish actual run logs in repository
        if: always()
        run: |
          if [ -d results ] && [ -n "$(find results -type f -print -quit)" ]; then
            printf 'GitHub Actions run: %s\nCommit: %s\nResult: %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "$GITHUB_SHA" "$GITHUB_JOB" > results/RUN-INFO.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add results/ screenshots/
            if ! git diff --cached --quiet; then
              git commit -m "Save actual Lab 4 run results #$GITHUB_RUN_NUMBER"
              git push
            fi
          fi

      - name: Stop managed nodes
        if: always()
        run: docker compose down
