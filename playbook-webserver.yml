---
- name: Configure Web Servers
  hosts: webservers
  become: true
  gather_facts: true

  vars:
    web_package: apache2
    web_service: apache2
    web_root: /var/www/html

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Apache web server
      ansible.builtin.apt:
        name: "{{ web_package }}"
        state: present

    - name: Ensure Apache is running and enabled
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: started
        enabled: true

    - name: Deploy custom index page from Jinja2 template
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ web_root }}/index.html"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: restarted
